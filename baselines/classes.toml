## 模型规格等级（weight classes），以及各等级允许消耗的预算开销。
##
## 下方记录的所有数值，要么直接读取自平台规范，要么在本机上实测得出，
## 且测试数据直接附在数值旁侧。此处没有任何凭空臆测，也没有平台未作强制要求的规则：
## 平台仅强制约束 `max_bytes`（最大字节限制）与单回合截止时限（turn deadline），
## 而本文件定义的是本仓库在满足这些硬约束的前提下所选取的工程配置基线。

[metric]
## S' = artifact_bytes + len(manifest)。即完整的 .onnx 文件与完整的清单文档的原始字节总和
## —— 并非 zstd 压缩后的大小，也不仅计入权重初始化器（initializers）。
## `tinybrains check` 将其报告为 `size_metric_bytes`。
##
## 为什么采用原始字节？压缩指标（对 `GraphProto.initializer` 与适配器执行 zstd 压缩）
## 在两方面均存在漏洞：计算图完全可以将权重存放在 `Constant` 节点属性中而非初始化器中
## —— 仅需 8 行 `onnx.helper` 代码，数学计算完全等价 —— 却能被计为 0 大小；
## 此外在平台准入链路上也无法对文档进行即时压缩。
## `artifact_bytes` 是节点在对对象重新计算哈希后称重的实际大小，
## 因此无论权重藏在何处，该数值都无法被虚报或低估。
##
## 在此指标下，基于已发布构件实测得出的单参数字节开销：
##   fp32   (11,350 - 0) / 3,006  = 3.78   (nano-bc)
##   fp16   (53,496 - 0) / 24,077 = 2.22   (micro-bc)
## 计算图的拓扑结构并非毫无开销 —— 它会占用数百字节的 protobuf 结构，
## 这正是实测值略高于理论值 4.0 与 2.0 的原因。
fp32_bytes_per_param = 3.78
fp16_bytes_per_param = 2.22
## 清单（manifest）是第二项，完整且未压缩计入。
## 执行 `python -m tb_baselines.adapters | wc -c` 测量。特征平面集变动时需重新生成。
## 启用 `--memory` 时，清单声明第二个输入与输出端口，实测大小为 1,194 字节
## (`python -m tb_baselines.adapters --memory | wc -c`)；
## 启用 `--ants` 时（单蚁记忆：3 个输入端口，单蚁一行输出）实测为 2,674 字节；
## 两者兼备时实测为 2,937 字节。`export.py` 依据下方声明的基准值进行预算编排，
## 因此带记忆模型会将这部分字节开销以及额外的输入权重通道计入对应规格的目标开销中；
## 单蚁记忆完全无法塞入 nano（仅计算图本身就已超限），因此 `micro` 是能够训练单蚁记忆的最小规格。
manifest_bytes = 931

[target]
## 基线模型瞄准其上限容量的比例。基线是“参考基准点（REFERENCE POINT）”，
## 因此应当展现该规格所能容纳的上限实力，而非居于中游水平 —— 但也不能卡死在天花板上，
## 否则几百字节的轻微扰动在重新导出时就可能突破上限被推入下一个规格，进而变更所处天梯。
## 70% 的比例留出了充分的安全余量，同时依然符合“该规格下的满额参赛作品”定位。
##
## 单个规格可以覆盖此值，`small` 确实覆盖了：详见其条目。
## 仅当时间配额允许时，“填满规格容量”才是一个合理的目标，而下方的 `max_share` 正是决定这一点的关键。
fraction = 0.70

## 单个构件允许占用的单座回合超时预算的最大比例，在最严苛的参考棋盘上实测。
## `export.py` 会拒绝任何超出此比例的构件。这是一项防患未然的余量规则，而非平台原生规则：
## 平台会对超时的座位判负，如果在本机上就需要消耗 95% 的时间配额，
## 那么在更拥挤的棋盘或更慢的宿主机上将完全没有任何安全余量。
max_share = 0.70

[dtype]
## 使用 fp16 初始化器，并在每次使用时通过 `Cast` 算子转为 float32。
## 运行时的计算图优化器会对 Cast 进行常量折叠，因此缩减的是“文件体积” —— 这正是尺寸指标所衡量的物理量。
##
## 实测结果甚至优于理论预期：在相同 S 指标下参数量达到 2.03 倍，推理耗时从 5.16 ms 变为 5.35 ms
## （完全处于包含预热单次运行的测量噪声范围内），算子集保持不变（Cast、Conv、Relu —— 全在白名单中），
## 且在 3 场实测比赛中 396 条单蚁指令与 fp32 计算图完全一致。没有任何理由发布 fp32 构件。
default = "fp16"

[compute]
## 在 `mini` 及以上规格中，字节上限不再是瓶颈制约因素。单回合截止时限才是！
##
## 单个座位的时限配额即为整个回合时限。`kalam-match` 运行单场对局时为每个座位分别调用一次 `model_infer`，
## 各自拥有独立的 `timeout_ms`，因此不存在跨座位批处理，也不存在配额平分。
## 本仓库依然将自身约束在回合的一定比例内而非全部耗尽，因为在本机上就需要 95% 时限的模型在较慢宿主上必死无疑。
##
## 70 GFLOP/s 为本机算力，在最严苛的参考棋盘（128x128，即 `infer_us_max` 所报告的情况）上直接测试构件得出：
##
##   micro-bc      24,001 参数  14.33 ms  ->  55 GFLOP/s   全分辨率
##   micro-percell 24,953 参数  10.75 ms  ->  76           全分辨率，仅 1x1 卷积
##   mini probe   196,149 参数  21.09 ms  ->  76           主体在步长 2 下运行
##   small probe  633,829 参数  18.37 ms  ->  71           主体在步长 4 下运行
##
## 本文件更早版本曾写为 1.85e11，源自 `ants-dense` 在 1.18 ms/座-回合的测试。
## 那存在约 3 倍的偏差，该教训值得铭记：1.18 ms 是一组波次的平均值，其中多数棋盘为 `standard`（64x96，单元格少 2.7 倍），
## 而我们必须对照最大棋盘的预算进行约束。相同测试在 128x128 上耗时 3.54 ms —— 即 62 GFLOP/s，这与上述数据完全吻合。
turn_ms = 1000
## 目前每次调用对应 1 个座位 —— 保留为具名常量，因为 `export.py` 依据 `share_us = turn_ms / rows_per_call` 进行校验，
## 显式声明为 1 是诚实的表达，而非直接删掉该行。
rows_per_call = 1
flops_per_second = 7.0e10
## => 每个座位每回合 2.2 GFLOP => 在 128x128 棋盘上全卷积网络对应约 67,000 个参数。
## 因此 `micro` 已逼近全分辨率的算力上限，而非 `mini` —— 本文件中的所有架构设计都是正确的，只是当初解释它们的常量有误。

## ---------------------------------------------------------------------------------------------
## 五大规格等级。`max_bytes` 由平台统一定义（soma/migrations/0001_init.sql，按赛季划分 —— 赛季可能仅开放部分规格，若未在 `classes.allow` 中开放将被拒绝为 CLASS_NOT_OFFERED）；
## 其余一切配置均归本仓库自主决定，`export.py` 会拒绝任何未达标的构件。

[[class]]
name = "nano"
max_bytes = 16384
## 5,340 字节权重 -> 约 2,900 个 fp16 参数。0.1 GFLOP：远未触及超时上限。
arch = "trunk"
channels = 9
blocks = 3            # 4 个 3x3 卷积，膨胀率分别为 1, 2, 4, 8：各方向感受野达到 15 个单元格
## 最初的 NANO 设计为 30 通道且仅有 1 个 3x3 卷积 —— 宽度提升 10 倍但感受野仅有 1 个单元格。
## 它在 1 个 epoch 内便在 44.6% 的教师一致率上陷入平台期，繁衍的蚁群仅有 5 只蚂蚁，而教师能繁衍 33 只。
## 9 通道但能覆盖 15 格视野是更优的权衡折中，探索出这一点正是本仓库的核心价值所在。
target_params = 2939

[[class]]
name = "micro"
max_bytes = 131072
## 约 24,900 个 fp16 参数，0.8 GFLOP。现有 `ants-dense` 固件所处的规格等级，
## 因此这里的一切指标均可直接与已知基准构件对照。
arch = "trunk"
channels = 28
blocks = 3            # 感受野达到 15 格，与 nano 一致
## 最初的 micro 设计为 48 通道与 5x5 视野：26,453 个参数，47.2% 一致率，
## 在 18 个棋盘的对抗中败给了仅有 3,005 参数的 nano，尽管其蚁群规模更大。模型容量绝非其短板所在。
target_params = 24001

[[class]]
name = "mini"
max_bytes = 1048576
## 约 201,000 个 fp16 参数。在 128x128 全分辨率下需要 6.6 GFLOP，而配额仅有 5.8 GFLOP ——
## 这是首个截止时限先于字节数产生瓶颈的规格等级！因此主干网络的中间部分以步长 2（stride 2）运行，
## 参数计算开销降至四分之一，从而能够充分利用字节预算。
arch = "encdec"
channels = 64
stride = 2
## 选用 3 个块而非 5 个块，这是由棋盘决定的。`Stage` 会按其总膨胀率进行环面填充 ——
## 即 `doubling(blocks + 1, cap=4)` —— 在步长 2 下该环面折叠应用于边长减半（side/2）的棋盘上。
## 5 个块的感受野达到 19，因此要求 side >= 38：引擎的基础棋盘（24, 36）以及三分之一的赛季棋盘均小于此尺寸。
## 它甚至不会显式报错 —— `wrap` 负责切片，而 Python 切片会自动截断（CLAMP），导致填充默默不足，
## 未填充的卷积不断缩减棋盘尺寸，直到 skip concat 在 3 帧之后意外崩溃。
## 3 个块的感受野为 11，要求 side >= 22，平台自带或任何赛季采用过的所有棋盘均能安全运行。
blocks = 3
## 在 blocks = 3 下实测：122,293 参数，S' = 254,323（253,393 字节计算图 + 930 字节清单）。
## 5 个块能够填满规格预算（196,149）；在深度受限于棋盘的情况下，需要靠宽度来重新填满。
## 暂未测定耗时：`tinybrains check` 目前在任何深度下的 skip concat 处都会拒绝 encdec 计算图，因此暂无实测时限数据可记录。
target_params = 122000

[[class]]
name = "small"
max_bytes = 8388608
## 约 1,610,000 个 fp16 参数：全分辨率下需 52.8 GFLOP，达到时限配额的 9 倍。
## 计算主体迁移至步长 4（计算成本降低 16 倍），将其降至约 3.3 GFLOP。
arch = "encdec"
channels = 128
stride = 4
blocks = 4
## **`small` 无法达到其容量上限的 70%，其深层原因值得深思。** 在步长 4 下实测：
##
##   通道 128, 6 块   907,317 参数   S 1,635,399 (上限的 39%)   26.9 ms = 86% 时限配额
##   通道 128, 10 块  1,497,653      S 2,697,338 (64%)          53.5 ms = 171%  拒绝 (REFUSED)
##   通道 160, 8 块   1,878,145      S 3,370,663 (80%)          60.0 ms = 192%  拒绝 (REFUSED)
##
## 该规格允许 400 万字节，但回合时限仅允许约 100 万参数的计算工作量。
## 字节并非此处的瓶颈约束，无论如何调参都无法改变这点 —— 正确的解法是采用不同“类型”的参数，
## 这正是 `large` 说明中所阐述的内容。在此之前，`small` 诚实地保持在四分之一容量，
## 并在其模型卡片上如实说明。5 个块实测占用了 75% 的配额，`export.py` 予以拒绝，这是门禁在尽职工作而非受挫倒退。
fraction = 0.27
target_params = 634000

[[class]]
name = "large"
max_bytes = 67108864
## 约 12,900,000 个 fp16 参数，全分辨率下需约 420 GFLOP：约为时限配额的 70 倍。
## 没有任何稠密架构能在单回合时限内达到该上限的 70% —— 即使在步长 8 下仍需约 36 ms。
## 64 MiB 也是所有节点的 `max_artifact_bytes`，Soma 会拒绝超过此上限的规格。
##
## 这是天梯顶层的一项深刻事实而非系统缺陷：large 规格字节富足但 FLOP 贫乏，
## 因此其字节必须用于购买“知识（KNOWLEDGE）”而非“算术算力（ARITHMETIC）”。
## 规划中的架构是可学习的模式查表（learned pattern table）—— 将局部邻域哈希为索引，
## 通过 `Gather` 检索嵌入向量，再运行轻量预测头 —— 此时字节随表容量扩展，而 FLOP 仅随嵌入维度扩展。
## `Gather` 属于白名单算子，且整套架构可端到端训练。
##
## 这是矩阵中风险最高的单元格，也是最后构建的单元格。在此之前，此处的 `target_params` 仅为占位符，
## `export.py` 将拒绝为其提供准入认证。
arch = "lookup"
fraction = 0.35
target_params = 0
phase = "not built"
